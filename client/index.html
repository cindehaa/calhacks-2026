<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="board"></canvas>

  <div id="hud">
    <div id="hudTop"><span id="clock">1:30</span><span id="roomInfo"></span><span id="netStatus">connecting…</span></div>
  </div>

  <div id="dock">
    <div id="elixir"><div id="elixirFill"></div><span id="elixirText">5</span></div>
    <form id="describe" autocomplete="off">
      <input id="descInput" placeholder="Describe a troop, then Enter (click the board first to pick a spot)" maxlength="300">
    </form>
    <div id="status"></div>
    <div id="hand"></div>
  </div>

  <div id="lobby" class="overlay">
    <div class="panel">
      <h1>Arena</h1>
      <p class="sub">A lane battler where your deck is whatever you can describe.</p>
      <div id="lobbyOut">
        <label>Name <input id="nameInput" maxlength="20"></label>
        <div class="row">
          <button id="createBtn">Create room</button>
          <button id="demoBtn">Join DEMO</button>
        </div>
        <form id="joinForm" class="row"><input id="codeInput" placeholder="CODE" maxlength="4"><button>Join</button></form>
      </div>
      <div id="lobbyIn" hidden>
        <p>Room <b id="roomCode"></b></p>
        <ul id="players"></ul>
        <div class="row">
          <button id="startBtn">Start match</button>
          <button id="leaveBtn" class="ghost">Leave</button>
        </div>
      </div>
      <p id="lobbyError" class="error"></p>
    </div>
  </div>

  <div id="result" class="overlay" hidden>
    <div class="panel">
      <h1 id="resultText"></h1>
      <p id="resultDetail" class="sub"></p>
      <div class="row">
        <button id="rematchBtn">Rematch</button>
        <button id="lobbyBtn" class="ghost">Leave room</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
