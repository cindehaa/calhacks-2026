<!doctype html>
<meta charset="utf-8">
<title>Caption</title>
<!-- A spoken line as the game shows the opponent's words: a frost-white chamfered bubble edged in
     the speaker's side colour, with their name above. ?speaker=Cindy&text=An ice wizard&y=1000 -->
<link rel="stylesheet" href="kit.css">
<style>
  #cap { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 1500px; }
  #who { font: 800 24px var(--cinzel); letter-spacing: .16em; text-transform: uppercase; text-shadow: 0 2px 0 #000, 0 0 12px #000; }
  #bubble { position: relative; padding: 16px 38px 18px; border-left: 8px solid; text-align: center; font: 800 46px/1.18 var(--ui); color: #10131f;
    background: linear-gradient(162deg, #eef3fb 0 50%, #d6deec 50%);
    clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px); }
  #wrap { filter: drop-shadow(0 5px 0 #8fa2bf) drop-shadow(0 8px 16px #000b); }
</style>
<div id="stage"><div id="cap"><div id="who"></div><div id="wrap"><div id="bubble"></div></div></div></div>
<script type="module">
  import { P, num, register, SIDES, sideOf } from './kit.js';
  const speaker = P.get('speaker') ?? 'Cindy', side = SIDES[P.get('side') ?? sideOf(speaker)];
  const who = document.getElementById('who'), bubble = document.getElementById('bubble'), cap = document.getElementById('cap');
  who.textContent = speaker;
  who.style.color = side.accent;
  bubble.style.borderColor = side.accent;
  bubble.textContent = `“${(P.get('text') ?? '').replace(/^“|”$/g, '')}”`;
  document.fonts.ready.then(() => { cap.style.top = `${num('y', 1010) - cap.offsetHeight}px`; });
  register(1, () => {});
</script>
