<!doctype html>
<meta charset="utf-8">
<title>Banner from below</title>
<!-- The cold open's team banners: the game's own rippling tapestry (client/src/banner.ts) shot from
     below as the camera cranes up, over the frozen night sky. ?side=blue&name=Cindy&alpha=1 -->
<link rel="stylesheet" href="kit.css">
<style>
  #sky { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 110%, #2a1c1a 0%, transparent 60%), linear-gradient(180deg, #05060f 0%, #0a0c1a 45%, #141a33 100%); }
  #moon { position: absolute; width: 260px; right: 220px; top: 120px; opacity: .85; filter: drop-shadow(0 0 40px #cfe0f066); }
  #rig { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 125%; }
  #cloth { position: absolute; left: 50%; top: -60px; width: 560px; height: 1292px; margin-left: -280px; transform-origin: 50% 0; container-type: inline-size; }
  #cloth svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #overlay { position: absolute; left: 0; right: 0; top: 36.5%; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  #side { font: 700 7cqw var(--cinzel); letter-spacing: .3em; text-transform: uppercase; color: #ffffffb0; }
  #name { font: 900 15cqw/1 var(--cinzel); text-transform: uppercase; color: #fff4dc; text-shadow: 0 3px 0 #0006; }
  #warm { position: absolute; inset: auto 0 0; height: 420px; background: radial-gradient(ellipse 60% 100% at 50% 100%, #ff8a3d38, transparent 70%); mix-blend-mode: screen; }
</style>
<div id="stage">
  <div id="sky"><img id="moon" src="moon.svg"></div>
  <canvas id="snowBack" class="fx"></canvas>
  <div id="rig"><div id="cloth"><svg id="svg" viewBox="0 0 260 600"></svg><div id="overlay"><div id="side"></div><div id="name"></div></div></div></div>
  <canvas id="snowFront" class="fx"></canvas>
  <div id="warm"></div>
</div>
<script>
  // banner.ts runs off requestAnimationFrame; drive it from seek(t) instead of the wall clock.
  window.__frames = [];
  window.requestAnimationFrame = (f) => { window.__frames.push(f); return window.__frames.length; };
</script>
<script src="game.js"></script>
<script type="module">
  import { P, prog, ease, mix, canvas, snow, register, SIDES } from './kit.js';
  const side = SIDES[P.get('side') ?? 'blue'], alpha = P.has('alpha'), D = Number(P.get('dur') ?? 4);
  document.getElementById('side').textContent = side.name;
  document.getElementById('name').textContent = P.get('name') ?? 'Cindy';
  // The moon sits on the far side from the banner's lit rim, so the two cuts mirror each other.
  if (side.house === 'sun') Object.assign(document.getElementById('moon').style, { right: 'auto', left: '220px' });
  if (alpha) for (const id of ['sky', 'snowBack', 'snowFront', 'warm']) document.getElementById(id).remove();
  window.Game.tapestry(document.getElementById('svg'), document.getElementById('overlay'), { house: side.house, rim: side.house === 'raven' ? 'right' : 'left', phase: side.house === 'raven' ? 0 : 2.4 });
  const back = !alpha && canvas(document.getElementById('snowBack')), front = !alpha && canvas(document.getElementById('snowFront'));
  const cloth = document.getElementById('cloth'), moon = document.getElementById('moon');
  let clock = 0;
  const tick = (t) => { const fs = window.__frames; window.__frames = []; for (const f of fs) f(t * 1000); };
  register(D, (t) => {
    // Step the cloth through every 1/60 s up to t, so its wave and gusts play out naturally.
    for (; clock < t; clock = Math.min(t, clock + 1 / 60)) tick(clock + 1 / 60);
    tick(t);
    // The crane: start low and steep under the cloth, ease up and back as it unfurls overhead.
    const k = prog(t, 0, D, ease.inOut);
    cloth.style.transform = `translateY(${mix(60, -10, k)}px) rotateX(${mix(24, 9, k)}deg) scale(${mix(1.4, 1.12, k)})`;
    if (!alpha) {
      moon.style.transform = `translateY(${mix(40, -30, k)}px)`;
      back.clearRect(0, 0, 1920, 1080); front.clearRect(0, 0, 1920, 1080);
      snow(back, t + 3, { n: 140, seed: 3, alpha: 0.45 });
      snow(front, t + 3, { n: 50, seed: 9, alpha: 0.9, wind: 60 });
    }
  });
</script>
