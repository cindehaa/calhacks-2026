<!doctype html>
<meta charset="utf-8">
<title>Callout</title>
<!-- A trailer callout the first time a mechanic happens: gold Cinzel slammed onto a stone band,
     throwing embers and ice like the countdown's FIGHT!. ?text=Line one|line two&dur=3.2&x=960&y=540 -->
<link rel="stylesheet" href="kit.css">
<style>
  #band { position: absolute; left: 50%; transform-origin: 50% 50%; }
  #band .slab { padding: 30px 84px 34px; border-bottom: 4px solid var(--amber); }
  #band .slab::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--amber); box-shadow: 0 0 18px var(--amber); }
  #text { position: absolute; left: 50%; margin: 0; text-align: center; white-space: nowrap; font: 900 84px/1.08 var(--cinzel); letter-spacing: .03em; text-transform: uppercase; }
  #glow { position: absolute; left: 50%; width: 1500px; height: 520px; margin-left: -750px; border-radius: 50%; background: radial-gradient(closest-side, #ffcf7a66, #ff8a3d22 55%, transparent); mix-blend-mode: screen; }
</style>
<div id="stage">
  <div id="glow"></div>
  <div id="band" class="slabWrap"><div class="slab"></div></div>
  <h1 id="text" class="gold"></h1>
</div>
<script type="module">
  import { P, num, prog, ease, mix, life, canvas, burst, register } from './kit.js';
  const D = num('dur', 3.2), X = num('x', 960), Y = num('y', 540), IMPACT = 0.22;
  const text = document.getElementById('text'), band = document.getElementById('band'), slab = band.firstElementChild, glow = document.getElementById('glow');
  text.innerHTML = (P.get('text') ?? 'Aim with your finger').split('|').map((l) => `<span>${l.trim()}</span>`).join('');
  const g = canvas();
  let w = 0, h = 0;
  document.fonts.ready.then(() => {
    w = text.offsetWidth; h = text.offsetHeight;
    slab.style.width = `${w + 168}px`; slab.style.height = `${h + 64}px`; slab.style.padding = '0';
    band.style.top = `${Y - (h + 64) / 2}px`; band.style.marginLeft = `${-(w + 168) / 2}px`;
    text.style.top = `${Y - h / 2}px`; text.style.marginLeft = `${-w / 2}px`;
    glow.style.top = `${Y - 260}px`;
    for (const el of [band, text, glow]) el.style.left = `${X}px`;
  });
  register(D, (t) => {
    const all = life(t, D, 0.01, 0.35), out = prog(t, D - 0.35, 0.35, ease.in);
    band.style.opacity = all;
    band.style.transform = `scaleX(${prog(t, 0, 0.3, ease.outExpo) * mix(1, 0.92, out)})`;
    const k = prog(t, 0.06, IMPACT - 0.06, ease.in), drift = 1 + 0.035 * prog(t, IMPACT, D, ease.linear);
    text.style.opacity = Math.min(prog(t, 0.06, 0.1, ease.linear), all);
    text.style.transform = `translateY(${-14 * out}px) scale(${mix(1.6, 1, k) * drift})`;
    text.style.filter = `blur(${mix(10, 0, k)}px) drop-shadow(0 5px 0 var(--amberSide)) drop-shadow(0 4px 0 #000) drop-shadow(0 0 28px #ff8a2e66)`;
    glow.style.opacity = t < IMPACT ? 0 : Math.max(0, 1 - (t - IMPACT) / 0.7) * 0.9 + 0.15 * all;
    g.clearRect(0, 0, 1920, 1080);
    burst(g, t, IMPACT, { x: X, y: Y + h / 2, spread: w / 2, n: 70, seed: 11 });
    burst(g, t, IMPACT, { x: X, y: Y - h / 2, spread: w / 2.4, n: 30, seed: 12, power: 0.7 });
  });
</script>
