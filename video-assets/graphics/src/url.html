<!doctype html>
<meta charset="utf-8">
<title>URL reveal</title>
<!-- Beat 5: the game's address blurs in over the montage on a stone slab with an amber underline,
     like the describe field. ?url=artifice-game.vercel.app&y=760&dur=10 -->
<link rel="stylesheet" href="kit.css">
<style>
  #box { position: absolute; left: 50%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 26px 70px 30px; }
  #box > .slab { position: absolute; inset: 0; --c: 20px; opacity: .9; }
  #play { position: relative; font: 800 30px var(--cinzel); letter-spacing: .3em; text-transform: uppercase; color: var(--amber); text-shadow: 0 0 18px #ff8a2e66; }
  #url { position: relative; font: 800 78px/1 var(--ui); color: var(--text); white-space: nowrap; text-shadow: 0 0 30px #9cc3e044; }
  #rule { position: absolute; left: 20px; right: 20px; bottom: 0; height: 4px; background: var(--amber); box-shadow: 0 0 18px var(--amber); transform-origin: 50% 50%; }
</style>
<div id="stage"><div id="box" class="slabWrap"><div class="slab"></div><div id="play">Play now</div><div id="url"></div><i id="rule"></i></div></div>
<script type="module">
  import { P, num, prog, ease, mix, life, register } from './kit.js';
  const D = num('dur', 10), Y = num('y', 760);
  const box = document.getElementById('box'), url = document.getElementById('url'), play = document.getElementById('play'), rule = document.getElementById('rule'), slab = box.firstElementChild;
  url.textContent = P.get('url') ?? 'artifice-game.vercel.app';
  document.fonts.ready.then(() => { box.style.top = `${Y - box.offsetHeight / 2}px`; box.style.marginLeft = `${-box.offsetWidth / 2}px`; });
  register(D, (t) => {
    const all = life(t, D, 0.01, 0.6), k = prog(t, 0, 1.3, ease.out);
    slab.style.opacity = 0.9 * prog(t, 0.1, 0.6) * all;
    url.style.opacity = prog(t, 0, 0.7, ease.linear) * all;
    url.style.filter = `blur(${mix(26, 0, k)}px)`;
    url.style.letterSpacing = `${mix(0.32, 0.01, k)}em`;
    play.style.opacity = prog(t, 0.6, 0.5) * all;
    play.style.transform = `translateY(${mix(10, 0, prog(t, 0.6, 0.5))}px)`;
    rule.style.opacity = all;
    rule.style.transform = `scaleX(${prog(t, 0.8, 0.7, ease.outExpo)})`;
  });
</script>
