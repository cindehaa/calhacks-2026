<!doctype html>
<meta charset="utf-8">
<title>Title card</title>
<!-- Beat 3: the Artifice wordmark slams in at the riser's peak (t = 0), throwing embers and ice; then
     frost creeps in from the corners while embers rise from a warm glow below, warmth against frost.
     Black behind it; ?alpha=1 drops the black. -->
<link rel="stylesheet" href="kit.css">
<style>
  #mark { position: absolute; left: 0; right: 0; top: 50%; margin: -150px 0 0; text-align: center; font: 700 236px/1.1 var(--deco); letter-spacing: .06em; }
  #mark.gold { filter: drop-shadow(0 9px 0 var(--amberSide)) drop-shadow(0 7px 0 #000) drop-shadow(0 0 60px #ff8a2e88); }
  .frost { position: absolute; width: 520px; opacity: 0; }
  .frost.tl { left: 0; top: 0; transform-origin: 0 0; } .frost.tr { right: 0; top: 0; transform-origin: 100% 0; }
  .frost.bl { left: 0; bottom: 0; transform-origin: 0 100%; } .frost.br { right: 0; bottom: 0; transform-origin: 100% 100%; }
  #hearth { position: absolute; inset: auto 0 0; height: 520px; background: radial-gradient(ellipse 50% 100% at 50% 100%, #ff8a3d55, #ff8a3d18 45%, transparent 75%); }
  #flash { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, #fff6dc, #ffb02e 40%, transparent 75%); mix-blend-mode: screen; }
  #ring { position: absolute; left: 50%; top: 50%; width: 400px; height: 400px; margin: -200px; border-radius: 50%; border: 6px solid #ffd27a; box-shadow: 0 0 40px #ffb02e, inset 0 0 40px #ffb02e; }
</style>
<div id="stage"><div id="hearth"></div><img class="frost tl" src="frost-tl.svg"><img class="frost tr" src="frost-tr.svg"><img class="frost bl" src="frost-bl.svg"><img class="frost br" src="frost-br.svg"><canvas id="rise" class="fx"></canvas><div id="ring"></div><div id="mark" class="gold">Artifice</div><div id="flash"></div></div>
<script type="module">
  import { P, num, prog, ease, mix, canvas, burst, snow, rng, register } from './kit.js';
  const D = num('dur', 5);
  if (!P.has('alpha')) document.body.classList.add('opaque');
  const mark = document.getElementById('mark'), flash = document.getElementById('flash'), ring = document.getElementById('ring'), hearth = document.getElementById('hearth');
  const frost = [...document.querySelectorAll('.frost')];
  const g = canvas(), up = canvas(document.getElementById('rise'));
  // Embers drifting up from the glow below, swaying and flickering. Pure in t.
  function embers(t, a) {
    const r = rng(77);
    up.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 70; i++) {
      const x0 = 260 + r() * 1400, speed = 60 + r() * 110, born = r() * 6, size = 1.5 + r() * 3, sway = r() * 6;
      const age = (t + 6 - born) % 6, y = 1100 - age * speed, x = x0 + Math.sin(age * 1.3 + sway) * 26;
      const life = Math.max(0, 1 - age / 5) * (0.6 + 0.4 * Math.sin(t * 9 + i)) * a;
      if (life <= 0 || y < 0) continue;
      const grd = up.createRadialGradient(x, y, 0, x, y, size * 4);
      grd.addColorStop(0, `rgba(255,236,190,${life})`); grd.addColorStop(0.3, `rgba(255,176,46,${life * 0.8})`); grd.addColorStop(1, 'rgba(255,138,61,0)');
      up.fillStyle = grd;
      up.beginPath(); up.arc(x, y, size * 4, 0, Math.PI * 2); up.fill();
    }
    up.globalCompositeOperation = 'source-over';
  }
  register(D, (t) => {
    const k = prog(t, 0, 0.16, ease.in);
    mark.style.opacity = prog(t, 0, 0.05, ease.linear);
    mark.style.transform = `scale(${mix(1.45, 1, k) * (1 + 0.045 * prog(t, 0.16, D, ease.linear))})`;
    mark.style.filter = `blur(${mix(14, 0, k)}px) drop-shadow(0 9px 0 var(--amberSide)) drop-shadow(0 7px 0 #000) drop-shadow(0 0 ${60 + 30 * Math.max(0, 1 - (t - 0.16) / 1.2)}px #ff8a2e99)`;
    flash.style.opacity = t < 0.16 ? 0 : 0.75 * Math.exp(-(t - 0.16) * 5);
    const r = prog(t, 0.16, 0.9, ease.outExpo);
    ring.style.opacity = t < 0.16 ? 0 : 0.9 * (1 - r);
    ring.style.transform = `scale(${mix(0.6, 5.5, r)}, ${mix(0.3, 1.4, r)})`;
    // Frost creeps in from each corner after the slam; the hearth glow swells under the embers.
    frost.forEach((f, i) => {
      const k = prog(t, 0.3 + i * 0.12, 2.2, ease.out);
      f.style.opacity = 0.8 * k;
      f.style.transform = `scale(${mix(0.5, 1, k)})`;
    });
    hearth.style.opacity = prog(t, 0.2, 1.2) * (0.85 + 0.15 * Math.sin(t * 3.1));
    up.clearRect(0, 0, 1920, 1080);
    embers(t, prog(t, 0.2, 1));
    g.clearRect(0, 0, 1920, 1080);
    snow(g, t + 2, { n: 90, seed: 21, alpha: 0.5 * prog(t, 0.3, 1.2) });
    burst(g, t, 0.16, { x: 960, y: 640, spread: 760, n: 140, seed: 31, power: 1.3, life: 1.8 });
    burst(g, t, 0.16, { x: 960, y: 470, spread: 700, n: 60, seed: 32, power: 0.9, life: 1.5 });
  });
</script>
