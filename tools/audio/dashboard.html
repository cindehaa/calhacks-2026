<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Board</title>
<style>
  :root {
    --bg: #111118; --panel: #1a1a24; --line: #2a2a38; --text: #e8e8f0; --dim: #8c8ca2;
    --accent: #f5b942; --play: #4fd18b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 12px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  h1 { font-size: 18px; margin: 0 auto 0 0; }
  header input[type=search] {
    background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 10px; width: 200px;
  }
  header label { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  button {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  main { padding: 16px; max-width: 1200px; margin: 0 auto; }
  section { margin-bottom: 28px; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .card h3 button { font-size: 12px; padding: 2px 8px; }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; flex-wrap: wrap; }
  .row .name { color: var(--dim); width: 56px; flex-shrink: 0; }
  .clip {
    position: relative; overflow: hidden; padding: 4px 10px; min-width: 34px;
  }
  .clip .bar { position: absolute; inset: auto 0 0 0; height: 3px; width: 0; background: var(--play); }
  .clip.playing { border-color: var(--play); color: var(--play); }
  .wide .clip { width: 100%; text-align: left; padding: 8px 12px; }
  .wide .prompt { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .hidden { display: none !important; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
  code { background: var(--panel); padding: 1px 5px; border-radius: 4px; }
  @media (max-width: 520px) { header input[type=search] { width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Sound Board</h1>
  <input type="search" id="filter" placeholder="Filter (e.g. heavy, hit)">
  <label>Volume <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8"></label>
  <button id="stop">Stop all (Esc)</button>
</header>
<main id="app"><p class="empty">Loading index.json…</p></main>

<script>
const app = document.getElementById('app');
const volEl = document.getElementById('vol');
const playing = new Set();

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

function stopAll() {
  for (const a of playing) { a.pause(); a.dispatchEvent(new Event('ended')); }
}

// Plays a clip on its button; returns a promise that resolves when it ends.
function play(btn) {
  const { file, loop } = btn.dataset;
  if (btn._audio) { btn._audio.pause(); btn._audio.dispatchEvent(new Event('ended')); return Promise.resolve(); }
  const a = new Audio(file);
  a.volume = Number(volEl.value);
  a.loop = loop === 'true';
  btn._audio = a;
  btn.classList.add('playing');
  playing.add(a);
  const bar = btn.querySelector('.bar');
  let raf;
  const tick = () => {
    if (a.duration) bar.style.width = `${(a.currentTime / a.duration) * 100}%`;
    raf = requestAnimationFrame(tick);
  };
  return new Promise((resolve) => {
    a.addEventListener('ended', () => {
      cancelAnimationFrame(raf);
      bar.style.width = '0';
      btn.classList.remove('playing');
      playing.delete(a);
      btn._audio = null;
      resolve();
    }, { once: true });
    a.addEventListener('error', () => a.dispatchEvent(new Event('ended')), { once: true });
    a.play().then(tick, () => a.dispatchEvent(new Event('ended')));
  });
}

async function playSequence(buttons) {
  for (const b of buttons) await play(b);
}

function clipButton(key, e, label) {
  return `<button class="clip" data-key="${esc(key)}" data-file="${esc(e.file)}" data-loop="${e.loop}" title="${esc(e.prompt)}">${esc(label)}<span class="bar"></span></button>`;
}

function render(index) {
  const entries = Object.entries(index);
  if (!entries.length) { app.innerHTML = '<p class="empty">index.json is empty.</p>'; return; }

  // sfx/<set>/<event>[_n] → troop sets, except sfx/game.
  const sets = {};
  const wide = { 'Match sounds': [], Music: [], Announcer: [] };
  for (const [key, e] of entries) {
    const parts = key.split('/');
    if (parts[0] === 'sfx' && parts[1] !== 'game') {
      const m = parts[2].match(/^(.*?)(?:_(\d+))?$/);
      const ev = ((sets[parts[1]] ??= {})[m[1]] ??= []);
      ev.push([key, e, m[2] ?? '▶']);
    } else {
      const group = parts[0] === 'music' ? 'Music' : parts[0] === 'voice' ? 'Announcer' : 'Match sounds';
      wide[group].push([key, e, parts.at(-1).replaceAll('_', ' ')]);
    }
  }

  const order = ['spawn', 'attack', 'hit', 'death'];
  let html = '';
  if (Object.keys(sets).length) {
    html += '<section><h2>Troop sets</h2><div class="grid">';
    for (const [set, events] of Object.entries(sets)) {
      const evs = Object.keys(events).sort((a, b) => order.indexOf(a) - order.indexOf(b));
      html += `<div class="card" data-search="${esc(set)}"><h3>${esc(set)} <button data-seq>play all</button></h3>`;
      for (const ev of evs) {
        html += `<div class="row" data-search="${esc(`${set} ${ev}`)}"><span class="name">${esc(ev)}</span>${events[ev].map(([k, e, l]) => clipButton(k, e, l)).join('')}</div>`;
      }
      html += '</div>';
    }
    html += '</div></section>';
  }
  for (const [group, clips] of Object.entries(wide)) {
    if (!clips.length) continue;
    html += `<section><h2>${group}</h2><div class="grid wide">`;
    for (const [k, e, l] of clips) {
      html += `<div data-search="${esc(`${group} ${k} ${e.prompt}`)}">${clipButton(k, e, l + (e.loop ? ' ⟳' : ''))
        .replace('<span class="bar">', `<div class="prompt">${esc(e.prompt)}</div><span class="bar">`)}</div>`;
    }
    html += '</div></section>';
  }
  app.innerHTML = html;
}

app.addEventListener('click', (ev) => {
  const seq = ev.target.closest('[data-seq]');
  if (seq) return playSequence([...seq.closest('.card').querySelectorAll('.clip')]);
  const btn = ev.target.closest('.clip');
  if (btn) play(btn);
});

volEl.addEventListener('input', () => { for (const a of playing) a.volume = Number(volEl.value); });
document.getElementById('stop').addEventListener('click', stopAll);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stopAll(); });

document.getElementById('filter').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  for (const el of app.querySelectorAll('.card, .wide > div')) {
    const rows = el.querySelectorAll('.row');
    if (!rows.length) { el.classList.toggle('hidden', !!q && !el.dataset.search.toLowerCase().includes(q)); continue; }
    let any = false;
    for (const r of rows) {
      const hit = !q || r.dataset.search.toLowerCase().includes(q);
      r.classList.toggle('hidden', !hit);
      any ||= hit;
    }
    el.classList.toggle('hidden', !any);
  }
  for (const s of app.querySelectorAll('section')) {
    s.classList.toggle('hidden', !s.querySelector('.card:not(.hidden), .wide > div:not(.hidden)'));
  }
});

fetch('index.json', { cache: 'no-store' })
  .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
  .then(render)
  .catch(() => {
    app.innerHTML = '<p class="empty">No index.json here yet. Run <code>node --env-file=.env tools/audio/generate.mjs</code>.</p>';
  });
</script>
</body>
</html>
